# Example inventory file - copy to hosts.yml and customize
# Converged setup: 3 physical hosts running both K8s and Ceph
all:
  children:
    # Kubernetes cluster nodes
    # NOTE: use plain IPv4 for ansible_host. Each server resolves its own FQDN
    # to a link-local IPv6 (mDNS), which breaks Ceph monmap/wait_for if FQDNs
    # are used instead of IPs.
    k8s_masters:
      hosts:
        homelab1:
          ansible_host: 172.26.20.248
          ansible_user: root
          node_hostname: k8s1.martinez-saweczko.es
        homelab2:
          ansible_host: 172.26.20.247
          ansible_user: root
          node_hostname: k8s2.martinez-saweczko.es
        homelab3:
          ansible_host: 172.26.20.246
          ansible_user: root
          node_hostname: k8s3.martinez-saweczko.es

    # Ceph cluster nodes (can overlap with K8s nodes)
    ceph_monitors:
      hosts:
        homelab1:
          ansible_host: 172.26.20.248
          ansible_user: root
          node_hostname: k8s1.martinez-saweczko.es
        homelab2:
          ansible_host: 172.26.20.247
          ansible_user: root
          node_hostname: k8s2.martinez-saweczko.es
        homelab3:
          ansible_host: 172.26.20.246
          ansible_user: root
          node_hostname: k8s3.martinez-saweczko.es

    ceph_osds:
      hosts:
        homelab1:
          ansible_host: 172.26.20.248
          ansible_user: root
          node_hostname: k8s1.martinez-saweczko.es
        homelab2:
          ansible_host: 172.26.20.247
          ansible_user: root
          node_hostname: k8s2.martinez-saweczko.es
        homelab3:
          ansible_host: 172.26.20.246
          ansible_user: root
          node_hostname: k8s3.martinez-saweczko.es
      # NOTE: OSD devices differ per host, they are defined in
      # host_vars/<host>.yml (ceph_osd_devices)
