---
# Basic Ceph monitor installation for Fedora
# - initialize primary monitor on the first host in group `ceph_monitors`
# - create keyrings, monmap and mkfs on primary
# - fetch required files to controller and copy them to other monitors

- name: Install Ceph packages (Fedora)
  become: true
  ansible.builtin.dnf:
    name: "{{ ceph_packages | default(['ceph-common', 'ceph-mon', 'ceph-mgr', 'ceph-mgr-dashboard']) }}"
    state: present

- name: Install all Ceph manager modules (Fedora)
  become: true
  ansible.builtin.shell: |
    dnf install -y ceph-mgr-* 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false

# Workaround for Ceph 20.2.2 + Python 3.14 bug (tracker.ceph.com/issues/70789)
# The C++ mgr code leaves an uncleaned AttributeError when NOTIFY_TYPES is missing,
# which poisons subsequent Python module loads and breaks the dashboard.
# This workaround adds a default NOTIFY_TYPES to the MgrModule base class.
# Remove this task once ceph-mgr >= 20.2.3 (or 20.2.2-2.fc44) is available.
- name: Apply NOTIFY_TYPES workaround for Ceph 20.2.2 + Python 3.14
  become: true
  ansible.builtin.lineinfile:
    path: /usr/share/ceph/mgr/mgr_module.py
    insertafter: '    MGR_POOL_NAME = ".mgr"'
    line: '    NOTIFY_TYPES = []'
    state: present
  when:
    - ansible_distribution == "Fedora"
    - ansible_distribution_major_version | int >= 44
  register: notify_types_workaround
  notify: Restart ceph-mgr daemon

- name: Ensure /etc/ceph exists
  become: true
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if Ceph monitor service is already active  # noqa command-instead-of-module
  ansible.builtin.command: |
    systemctl is-active ceph-mon@{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}
  register: ceph_mon_status
  failed_when: false
  changed_when: false

- name: Set fact to skip monitor initialization if already running
  ansible.builtin.set_fact:
    ceph_monitor_running: "{{ ceph_mon_status.rc | default(1) == 0 }}"

# PRIMARY: run once on the first ceph monitor to create fsid, ceph.conf, keyrings and monmap
- name: Check if cluster already has an FSID in ceph.conf (primary)
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    grep -m1 '^[[:space:]]*fsid[[:space:]]*=' /etc/ceph/ceph.conf 2>/dev/null | awk -F= '{print $2}' | tr -d ' '
  args:
    executable: /bin/bash
  register: existing_fsid
  changed_when: false
  failed_when: false
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Generate cluster FSID if not exists (primary)
  become: true
  ansible.builtin.command: uuidgen
  register: new_fsid
  when:
    - inventory_hostname == groups['ceph_monitors'][0]
    - existing_fsid.stdout is not defined or existing_fsid.stdout | length == 0
  run_once: true
  changed_when: true

- name: Set FSID fact (primary)
  become: true
  ansible.builtin.set_fact:
    ceph_cluster_fsid: "{{ existing_fsid.stdout | default(new_fsid.stdout) }}"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Render ceph.conf on primary
  become: true
  ansible.builtin.template:
    src: ceph.conf.j2
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Build monmap arguments (primary)
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  ansible.builtin.set_fact:
    _monmap_args: ""

- name: Append monmap args per monitor (primary)
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  ansible.builtin.set_fact:
    _monmap_args: "{{ _monmap_args + '--add ' + (hostvars[mon].get('ansible_hostname', mon)) + ' v2:' + (hostvars[mon].get('ansible_host', mon)) + ':3300 ' }}"
  loop: "{{ groups['ceph_monitors'] }}"
  loop_control:
    loop_var: mon

  ## Debug monmap args
- name: Debug monmap args (primary)
  ansible.builtin.debug:
    msg: "_monmap_args={{ _monmap_args }}"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Check if keyrings already exist (primary)
  become: true
  ansible.builtin.stat:
    path: /etc/ceph/ceph.mon.keyring
  register: mon_keyring_stat
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Create monitor keyrings and monmap (primary)
  become: true
  ansible.builtin.shell: |
    set -e
    # create monitor keyring
    ceph-authtool --create-keyring /etc/ceph/ceph.mon.keyring --gen-key -n mon. --cap mon 'allow *'
    # create admin keyring
    ceph-authtool --create-keyring /etc/ceph/ceph.client.admin.keyring --gen-key -n client.admin --cap mon 'allow *' --cap osd 'allow *' --cap mgr 'allow *'
    # import admin keyring into mon keyring so monitor recognizes client.admin
    ceph-authtool /etc/ceph/ceph.mon.keyring --import-keyring /etc/ceph/ceph.client.admin.keyring
    # remove existing monmap (monmaptool will error if file exists)
    rm -f /tmp/monmap || true
    # create monmap including all monitors
    monmaptool --create {{ _monmap_args }} /tmp/monmap
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and not mon_keyring_stat.stat.exists
  run_once: true
  changed_when: true

- name: Read monmap content (primary)
  become: true
  ansible.builtin.command: monmaptool --print /tmp/monmap
  register: monmap_raw
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: false

- name: Extract FSID raw line from monmap output (primary)
  ansible.builtin.set_fact:
    _monmap_fsid_raw: "{{ monmap_raw.stdout_lines | select('match', '^fsid') | list | first | default('') }}"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Clean and set monmap fsid fact (primary)
  ansible.builtin.set_fact:
    monmap_fsid: "{{ _monmap_fsid_raw | regex_replace('^fsid\\s+', '') }}"
  when:
    - inventory_hostname == groups['ceph_monitors'][0]
    - _monmap_fsid_raw is defined
    - _monmap_fsid_raw | length > 0
  run_once: true

- name: Update `fsid` in /etc/ceph/ceph.conf from monmap (primary)
  become: true
  community.general.ini_file:
    path: /etc/ceph/ceph.conf
    section: global
    option: fsid
    value: "{{ monmap_fsid }}"
    backup: true
    mode: "0644"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and monmap_fsid is defined and monmap_fsid != ''
  run_once: true

- name: Debug monmap args (primary)
  ansible.builtin.debug:
    msg: "_monmap_args={{ _monmap_args }}"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Check if monitor already initialized (primary)
  become: true
  ansible.builtin.stat:
    path: "/var/lib/ceph/mon/ceph-{{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}/store.db"
  register: mon_initialized_stat
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Create monitor data directory (primary)
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mon/ceph-{{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and not mon_initialized_stat.stat.exists
  run_once: true

- name: Initialize monitor (mkfs) on primary
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}
    ceph-mon -i "$mon_name" --mkfs --monmap /tmp/monmap --keyring /etc/ceph/ceph.mon.keyring
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and not mon_initialized_stat.stat.exists
  run_once: true
  changed_when: true

- name: Ensure monitor data directory ownership (primary)
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mon/ceph-{{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}"
    owner: ceph
    group: ceph
    recurse: true
    mode: "0750"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and not mon_initialized_stat.stat.exists
  run_once: true

- name: Ensure keyrings ownership and permissions (primary)
  become: true
  ansible.builtin.file:
    path: "/etc/ceph/{{ item }}"
    owner: ceph
    group: ceph
    mode: "0600"
  loop:
    - ceph.mon.keyring
    - ceph.client.admin.keyring
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running and not mon_initialized_stat.stat.exists
  run_once: true

- name: Enable and start ceph-mon service (primary)
  become: true
  ansible.builtin.systemd:
    name: "ceph-mon@{{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}"
    enabled: true
    state: started
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Pause to let primary monitor fully initialize
  ansible.builtin.pause:
    seconds: 10
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Create bootstrap-osd keyring directory (primary)
  become: true
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd
    state: directory
    mode: "0755"
    owner: ceph
    group: ceph
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

# DASHBOARD: setup Ceph dashboard on primary monitor
- name: Create mgr data directory (primary)
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mgr/ceph-{{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}"
    state: directory
    owner: ceph
    group: ceph
    mode: "0750"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Check if /tmp/monmap exists on primary
  ansible.builtin.stat:
    path: /tmp/monmap
  register: monmap_file_stat
  when: inventory_hostname == groups['ceph_monitors'][0]
  run_once: true

- name: Fetch primary ceph files to controller
  ansible.builtin.fetch:
    src: "{{ item.src }}"
    dest: /tmp/ceph-setup/primary/
    flat: true
  with_items:
    - { src: "/etc/ceph/ceph.conf" }
    - { src: "/etc/ceph/ceph.mon.keyring" }
    - { src: "/etc/ceph/ceph.client.admin.keyring" }
    - { src: "/tmp/monmap" }
  when:
    - inventory_hostname == groups['ceph_monitors'][0]
    - item.src != '/tmp/monmap' or monmap_file_stat.stat.exists | default(false)
  run_once: true

# SECONDARY: copy files from controller (populated from primary) to other monitors and initialize
- name: Wait for primary SSH to be reachable (others)
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['ceph_monitors'][0]].ansible_default_ipv4.address | default(hostvars[groups['ceph_monitors'][0]].ansible_host) }}"
    port: 22
    timeout: 120

- name: Copy ceph.conf from controller to monitor
  become: true
  ansible.builtin.copy:
    src: /tmp/ceph-setup/primary/ceph.conf
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Copy monmap to /tmp/monmap on host
  become: true
  ansible.builtin.copy:
    src: /tmp/ceph-setup/primary/monmap
    dest: /tmp/monmap
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Copy keyrings to monitor
  become: true
  ansible.builtin.copy:
    src: /tmp/ceph-setup/primary/{{ item }}
    dest: /etc/ceph/{{ item }}
    owner: root
    group: root
    mode: "0600"
  with_items:
    - ceph.mon.keyring
    - ceph.client.admin.keyring
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Create monitor data directory
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mon/ceph-{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}"
    state: directory
    owner: ceph
    group: ceph
    mode: "0750"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Clean monitor data directory if not empty (secondary)
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    mon_dir="/var/lib/ceph/mon/ceph-{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}"
    if [ -d "$mon_dir" ] && [ "$(ls -A "$mon_dir" 2>/dev/null | wc -l)" -gt 0 ]; then
      echo "Cleaning stale monitor data"
      rm -rf "${mon_dir:?}"/*
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: true

- name: Initialize monitor (mkfs) on secondary
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}
    ceph-mon -i "$mon_name" --mkfs --monmap /tmp/monmap --keyring /etc/ceph/ceph.mon.keyring
  args:
    executable: /bin/bash
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: true

- name: Ensure monitor data directory ownership (secondary)
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mon/ceph-{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}"
    owner: ceph
    group: ceph
    recurse: true
    mode: "0750"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Ensure keyrings ownership and permissions (secondary)
  become: true
  ansible.builtin.file:
    path: "/etc/ceph/{{ item }}"
    owner: ceph
    group: ceph
    mode: "0600"
  loop:
    - ceph.mon.keyring
    - ceph.client.admin.keyring
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Wait for primary monitor to be ready before starting secondary
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['ceph_monitors'][0]].ansible_host }}"
    port: 3300
    timeout: 120
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Enable and start ceph-mon service (secondary)
  become: true
  ansible.builtin.systemd:
    name: "ceph-mon@{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}"
    enabled: true
    state: started
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  failed_when: false

# QUORUM SYNCHRONIZATION: Wait for all monitors to form quorum before mgr setup
- name: Wait for all monitors to form quorum (before mgr setup)
  become: true
  ansible.builtin.wait_for:
    host: "{{ hostvars[mon].get('ansible_host', mon) }}"
    port: 3300
    timeout: 120
  loop: "{{ groups['ceph_monitors'] }}"
  loop_control:
    loop_var: mon
  when: inventory_hostname == groups['ceph_monitors'][0]
  run_once: true

- name: Ensure monitors advertise both v2 (3300) and v1 (6789) addresses
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    {% for mon in groups['ceph_monitors'] %}
    MON="{{ hostvars[mon].ansible_hostname | default(mon) }}"
    ADDR="{{ hostvars[mon].ansible_host | default(mon) }}"
    ceph mon set-addrs "${MON}" "[v2:${ADDR}:3300,v1:${ADDR}:6789]"
    {% endfor %}
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0]
  run_once: true
  changed_when: true
  failed_when: false

# - name: Verify cluster has quorum (using legacy port)
#   become: true
#   shell: |
#     ceph -m {{ ansible_default_ipv4.address }} mon stat -f json | grep -q "quorum"
#   register: quorum_check
#   until: quorum_check.rc == 0
#   retries: 24
#   delay: 5
#   when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
#   run_once: true

# - name: Enable msgr2 on cluster
#   become: true
#   shell: |
#     ceph -m {{ ansible_default_ipv4.address }}:6789 mon enable-msgr2
#   when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
#   run_once: true

# BOOTSTRAP-OSD: Create bootstrap-osd keyring after all monitors have quorum
- name: Check if bootstrap-osd key already exists in cluster auth
  become: true
  ansible.builtin.shell: |
    ceph auth get client.bootstrap-osd 2>/dev/null
  args:
    executable: /bin/bash
  register: bootstrap_osd_key_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Generate bootstrap-osd keyring if not exists (after quorum)
  become: true
  ansible.builtin.shell: |
    ceph auth get-or-create client.bootstrap-osd mon 'allow profile bootstrap-osd' osd 'allow *' > /var/lib/ceph/bootstrap-osd/ceph.keyring
  args:
    executable: /bin/bash
  when:
    - inventory_hostname == groups['ceph_monitors'][0]
    - bootstrap_osd_key_check.rc | default(0) != 0
  run_once: true
  changed_when: true

- name: Write existing bootstrap-osd keyring to file if already exists
  become: true
  ansible.builtin.shell: |
    ceph auth get client.bootstrap-osd > /var/lib/ceph/bootstrap-osd/ceph.keyring
  args:
    executable: /bin/bash
  when:
    - inventory_hostname == groups['ceph_monitors'][0]
    - bootstrap_osd_key_check.rc | default(1) == 0
  run_once: true
  changed_when: false

- name: Fix bootstrap-osd keyring permissions (after quorum)
  become: true
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
    mode: "0644"
    owner: ceph
    group: ceph
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Fetch bootstrap-osd keyring to controller (after generation)
  ansible.builtin.fetch:
    src: /var/lib/ceph/bootstrap-osd/ceph.keyring
    dest: /tmp/ceph-setup/primary/
    flat: true
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

# PRIMARY MGR/DASHBOARD SETUP: now that quorum is formed
- name: Create mgr keyring (primary)
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}
    mgr_keyring="/var/lib/ceph/mgr/ceph-${mon_name}/keyring"
    if [ ! -f "$mgr_keyring" ]; then
      ceph auth get-or-create mgr.${mon_name} mon 'allow profile mgr' osd 'allow *' mds 'allow *' -o "$mgr_keyring"
      chown ceph:ceph "$mgr_keyring"
      chmod 0600 "$mgr_keyring"
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: true

# - name: Reinstall ceph-mgr package to restore service file (primary)
#   become: true
#   shell: dnf reinstall -y ceph-mgr
#   when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
#   run_once: true

- name: Create override directory for ceph-mgr (primary)
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ceph-mgr@.service.d
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Create override.conf to ensure service works (primary)
  become: true
  ansible.builtin.copy:
    content: |
      [Unit]
    dest: /etc/systemd/system/ceph-mgr@.service.d/override.conf
    mode: "0644"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Reload systemd daemon (primary)
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: false

- name: Enable and start ceph-mgr service (primary)
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[groups['ceph_monitors'][0]]['ansible_hostname'] }}
    systemctl enable "ceph-mgr@${mon_name}"
    systemctl start "ceph-mgr@${mon_name}"
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: true

- name: Wait for mgr to be active
  become: true
  ansible.builtin.command: ceph mgr dump -f json
  register: mgr_status
  until: mgr_status.rc == 0
  retries: 12
  delay: 5
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: false

- name: Enable Ceph dashboard module
  become: true
  ansible.builtin.command: ceph mgr module enable dashboard --force
  register: dashboard_enable
  failed_when: dashboard_enable.rc != 0 and 'already enabled' not in dashboard_enable.stderr
  changed_when: "'already enabled' not in dashboard_enable.stderr"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

- name: Enable common Ceph manager modules
  become: true
  ansible.builtin.shell: |
    set +e
        # Keep this list conservative: several optional modules (influx, telegraf,
        # rgw, nfs, osd_perf_query, mds_autoscaler, alerts) crash on Fedora
        # ceph-mgr build and spam the crash log / HEALTH_WARN.
    for module in balancer crash devicehealth iostat progress prometheus status rbd_support pg_autoscaler; do
      ceph mgr module enable "$module" --force 2>/dev/null || true
    done
    set -e
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: false

- name: Set dashboard SSL port (Ceph 20.2.2 requires SSL)
  become: true
  ansible.builtin.shell: |
    set -e
    # Ceph 20.2.2 dashboard always uses SSL; the ssl setting is ignored
    # Set the SSL port and bind address
    ceph config set mgr mgr/dashboard/ssl_server_port {{ ceph_dashboard_port | default('8443') }}
    ceph config set mgr mgr/dashboard/server_addr 0.0.0.0
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0]
  run_once: true
  changed_when: true

- name: Create dashboard self-signed certificate (Ceph 20.2.2+ requires SSL)
  become: true
  ansible.builtin.shell: |
    ceph dashboard create-self-signed-cert 2>/dev/null || true
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['ceph_monitors'][0]
  run_once: true
  changed_when: false

- name: Create or update dashboard admin user
  become: true
  vars:
    dashboard_pwd: "{{ ceph_dashboard_password | default('admin') }}"
  ansible.builtin.shell: |
    set -e
    export CEPH_ARGS="--connect-timeout 5"
    echo -n "$DASHBOARD_PWD" > /tmp/dashboard_pwd.txt
    # Try to create user first; if user exists, update password
    ceph dashboard ac-user-create admin administrator --force-password -i /tmp/dashboard_pwd.txt 2>/dev/null || \
    ceph dashboard ac-user-set-password admin --force-password -i /tmp/dashboard_pwd.txt
  args:
    executable: /bin/bash
  environment:
    DASHBOARD_PWD: "{{ dashboard_pwd }}"
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true
  changed_when: true

- name: Display dashboard access information
  ansible.builtin.debug:
    msg:
      - "Ceph Dashboard is now available!"
      - "Active mgr (dashboard): Check with 'ceph mgr stat'"
      - "Access via any monitor IP: https://<monitor-ip>:{{ ceph_dashboard_port | default('8443') }}"
      - "Monitor IPs: {{ groups['ceph_monitors'] | map('extract', hostvars, 'ansible_host') | list | join(', ') }}"
      - "Username: admin"
      - "Password: {{ ceph_dashboard_password | default('admin') }}"
      - "Note: Dashboard requires HTTPS. Self-signed cert is auto-generated."
  when: inventory_hostname == groups['ceph_monitors'][0] and not ceph_monitor_running
  run_once: true

# DASHBOARD HA: setup standby mgr on secondary monitors
- name: Create mgr data directory (secondary)
  become: true
  ansible.builtin.file:
    path: "/var/lib/ceph/mgr/ceph-{{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}"
    state: directory
    owner: ceph
    group: ceph
    mode: "0750"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Create mgr keyring (secondary)
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}
    mgr_keyring="/var/lib/ceph/mgr/ceph-${mon_name}/keyring"
    if [ ! -f "$mgr_keyring" ]; then
      ceph auth get-or-create mgr.${mon_name} mon 'allow profile mgr' osd 'allow *' mds 'allow *' -o "$mgr_keyring"
      chown ceph:ceph "$mgr_keyring"
      chmod 0600 "$mgr_keyring"
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: true

- name: Reinstall ceph-mgr package to restore service file (secondary)
  become: true
  ansible.builtin.command: dnf reinstall -y ceph-mgr
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: true

- name: Create override directory for ceph-mgr (secondary)
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ceph-mgr@.service.d
    state: directory
    mode: "0755"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Create override.conf to ensure service works (secondary)
  become: true
  ansible.builtin.copy:
    content: |
      [Unit]
    dest: /etc/systemd/system/ceph-mgr@.service.d/override.conf
    mode: "0644"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running

- name: Reload systemd daemon (secondary)
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: false

- name: Enable and start ceph-mgr service (secondary)
  become: true
  ansible.builtin.shell: |
    set -e
    mon_name={{ hostvars[inventory_hostname].get('ansible_hostname', inventory_hostname) }}
    systemctl enable "ceph-mgr@${mon_name}"
    systemctl start "ceph-mgr@${mon_name}"
  args:
    executable: /bin/bash
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
  changed_when: true

- name: Display HA dashboard information
  ansible.builtin.debug:
    msg:
      - "Standby mgr daemon is now running on {{ inventory_hostname }}"
      - "This mgr will automatically take over if the active mgr fails"
  when: inventory_hostname != groups['ceph_monitors'][0] and not ceph_monitor_running
