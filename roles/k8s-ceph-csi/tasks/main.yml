- name: Install Ceph CSI RBD driver via Helm
  kubernetes.core.helm:
    name: ceph-csi-rbd
    chart_ref: ceph-csi/ceph-csi-rbd
    release_namespace: "{{ ceph_csi_namespace }}"
    values:
      kubeletDir: /var/snap/microk8s/common/var/lib/kubelet
      cephClusterSecretName: ceph-secret
      cephClusterSecretNamespace: "{{ ceph_csi_namespace }}"
      csiConfig:
        - clusterID: "{{ ceph_fsid.stdout }}"
          monitors:
            - "{{ ceph_monitors }}"
      provisioner:
        replicaCount: "{{ ceph_csi_provisioner_replicas }}"
      nodeplugin:
        hostNetwork: true
        tolerations:
          - effect: NoExecute
            key: node.kubernetes.io/not-ready
            operator: Exists
            tolerationSeconds: 300
          - effect: NoExecute
            key: node.kubernetes.io/unreachable
            operator: Exists
            tolerationSeconds: 300
        plugins:
          rbd:
            enabled: true
        serviceMonitor:
          enabled: false
        liveness:
          enabled: false
        livenessProbe:
          enabled: false
    # Post-installation task will remove the liveness sidecar if it exists
    wait: false
    force: true
    update_repo_cache: true
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  register: ceph_csi_helm_install
  run_once: true

- name: Remove liveness-prometheus sidecar from nodeplugin DaemonSet
  kubernetes.core.k8s_json_patch:
    kind: DaemonSet
    name: ceph-csi-rbd-nodeplugin
    namespace: "{{ ceph_csi_namespace }}"
    patch:
      - op: remove
        path: /spec/template/spec/containers/2
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  failed_when: false
  run_once: true

- name: Ensure provisioner replicas match node count
  kubernetes.core.k8s:
    kind: Deployment
    name: ceph-csi-rbd-provisioner
    namespace: "{{ ceph_csi_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ceph-csi-rbd-provisioner
        namespace: "{{ ceph_csi_namespace }}"
      spec:
        replicas: "{{ ceph_csi_provisioner_replicas }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  when: ceph_csi_helm_install is defined and ceph_csi_provisioner_replicas is defined
  register: scaled_provisioner
  failed_when: false

- name: Wait for CSI provisioner to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ ceph_csi_namespace }}"
    name: ceph-csi-rbd-provisioner
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_sleep: 5
    wait_timeout: 120
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"

- name: Check if StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ceph_csi_storage_class }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  register: sc_check
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"

- name: Create StorageClass for Ceph RBD
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ ceph_csi_storage_class }}"
      provisioner: rbd.csi.ceph.com
      parameters:
        clusterID: "{{ ceph_fsid.stdout }}"
        pool: "{{ ceph_k8s_pool }}"
        imageFeatures: "{{ ceph_csi_rbd_image_features }}"
        csi.storage.k8s.io/provisioner-secret-name: ceph-secret
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ ceph_csi_namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: ceph-secret
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ ceph_csi_namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: ceph-secret
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ ceph_csi_namespace }}"
      reclaimPolicy: "{{ ceph_csi_rbd_reclaim_policy }}"
      allowVolumeExpansion: "{{ ceph_csi_rbd_allow_expansion }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  when: sc_check.resources | length == 0

- name: Display CSI RBD installation summary
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "✓ Ceph CSI RBD Driver Installed"
      - "=========================================="
      - "Cluster ID: {{ ceph_fsid.stdout }}"
      - "Monitors: {{ ceph_monitors }}"
      - "Namespace: {{ ceph_csi_namespace }}"
      - "StorageClass: {{ ceph_csi_storage_class }}"
      - "Pool: {{ ceph_k8s_pool }}"
      - "RBD Client: {{ ceph_k8s_client }}"
      - ""
      - "Verify installation:"
      - "  kubectl get pods -n {{ ceph_csi_namespace }}"
      - "  kubectl get storageclass {{ ceph_csi_storage_class }}"
      - ""

- name: Test CSI RBD with PVC
  ansible.builtin.include_tasks: test.yml
  run_once: true # k8s resources are cluster-wide; running on all masters races delete/create
  when: enable_ceph_csi_test | bool
