---
- name: Get Ceph client.kubernetes keyring
  ansible.builtin.command: sudo ceph auth get client.kubernetes
  register: ceph_client_keyring
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_monitors'][0] }}"

- name: Distribute ceph.client.kubernetes.keyring to all hosts
  ansible.builtin.copy:
    content: "{{ ceph_client_keyring.stdout }}\n"
    dest: /etc/ceph/ceph.client.kubernetes.keyring
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Check if kubeconfig exists
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: kubeconfig_stat
  become: false

- name: Fail if kubeconfig not found
  ansible.builtin.fail:
    msg: "Kubeconfig not found at {{ kubeconfig_path }}. Please ensure Kubernetes is running and kubeconfig is copied."
  when: not kubeconfig_stat.stat.exists

- name: Create ceph-csi-rbd namespace
  kubernetes.core.k8s:
    name: "{{ ceph_csi_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"

- name: Add ceph-csi Helm repository
  kubernetes.core.helm_repository:
    name: ceph-csi
    repo_url: https://ceph.github.io/csi-charts
    state: present
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Get Ceph FSId
  ansible.builtin.command: sudo ceph fsid
  register: ceph_fsid
  changed_when: false

- name: Get Ceph monitor addresses (JSON)
  ansible.builtin.command: sudo ceph mon dump -f json
  register: ceph_mon_dump
  changed_when: false

- name: Build monitor list from mon dump with port 3300
  ansible.builtin.set_fact:
    ceph_monitors: "{{ (ceph_mon_dump.stdout | from_json).mons | map(attribute='addr') | map('regex_replace', ':[0-9]+/.*$', ':3300') | join(',') }}"

- name: Get Ceph client.kubernetes key
  ansible.builtin.command: sudo ceph auth get-key client.kubernetes
  register: ceph_client_key
  changed_when: false
  no_log: true

- name: Create ceph-secret in ceph-csi-rbd namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ceph-secret
        namespace: "{{ ceph_csi_namespace }}"
      type: Opaque
      stringData:
        userID: "{{ ceph_k8s_client }}"
        userKey: "{{ ceph_client_key.stdout }}"
        ceph.conf: |
          [global]
          fsid = {{ ceph_fsid.stdout }}
          mon_host = {{ ceph_monitors }}
          ms_mode = msgr2
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  no_log: true

- name: Create ceph-secret in target namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ceph-secret
        namespace: "{{ ceph_k8s_namespace }}"
      type: Opaque
      stringData:
        userID: "{{ ceph_k8s_client }}"
        userKey: "{{ ceph_client_key.stdout }}"
        ceph.conf: |
          [global]
          fsid = {{ ceph_fsid.stdout }}
          mon_host = {{ ceph_monitors }}
          ms_mode = msgr2
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PYTHONHTTPSVERIFY: "0"
  no_log: true

- name: Detect ready Kubernetes nodes
  ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig_path }} get nodes --no-headers 2>/dev/null | awk '$2=="Ready" {print $1}' | wc -l
  register: ready_nodes
  changed_when: false
  failed_when: false

- name: Set provisioner replicas based on node count
  ansible.builtin.set_fact:
    ceph_csi_provisioner_replicas: "{{ 1 if (ready_nodes.stdout | int) <= 1 else 3 }}"

# - name: Remove existing Ceph CSI RBD Helm release if present
#   kubernetes.core.helm:
