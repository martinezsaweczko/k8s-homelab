---
# Ceph OSD setup tasks - Simplified for single-node homelab

- name: Install Ceph OSD prerequisites
  ansible.builtin.dnf:
    name:
      - ceph
      - ceph-osd
      - python3-ceph-common
      - lvm2
    state: present

# Fedora 44 ships ceph-volume 20.2.2 with 'type': Optional[str] in
# devices/lvm/common.py (--dmcrypt-*-opts args). Python 3.14 argparse
# validates 'type' eagerly and crashes with "TypeError: str | None is not
# callable", breaking 'ceph-volume lvm create'. Patch it to plain 'str'.
- name: Locate ceph-volume lvm common.py
  ansible.builtin.shell: |
    python3 -c "import ceph_volume.devices.lvm.common as m; print(m.__file__)"
  register: ceph_volume_common_py
  changed_when: false

- name: Patch ceph-volume Optional[str] argparse types (Python 3.14 crash)
  ansible.builtin.replace:
    path: "{{ ceph_volume_common_py.stdout }}"
    regexp: "'type': Optional\\[str\\]"
    replace: "'type': str"

- name: Create Ceph OSD directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: ceph
    group: ceph
  loop:
    - /etc/ceph
    - /var/lib/ceph/osd

- name: Check if Ceph configuration exists locally
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_conf_local

- name: Wait for Ceph monitors to be ready
  ansible.builtin.pause:
    seconds: 20
  when: not ceph_conf_local.stat.exists

- name: Get Ceph configuration from monitor (if not local)
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: ceph_conf_content
  delegate_to: "{{ groups['ceph_monitors'][0] }}"
  when: not ceph_conf_local.stat.exists

- name: Write Ceph configuration to local OSD
  ansible.builtin.copy:
    content: "{{ ceph_conf_content.content | b64decode }}"
    dest: /etc/ceph/ceph.conf
    mode: "0644"
  when:
    - not ceph_conf_local.stat.exists
    - ceph_conf_content is defined

- name: Check if Ceph admin keyring exists locally
  ansible.builtin.stat:
    path: /etc/ceph/ceph.client.admin.keyring
  register: ceph_keyring_local

- name: Get Ceph admin keyring from monitor (if not local)
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.client.admin.keyring
  register: ceph_admin_keyring_content
  delegate_to: "{{ groups['ceph_monitors'][0] }}"
  when: not ceph_keyring_local.stat.exists

- name: Write Ceph admin keyring to local OSD
  ansible.builtin.copy:
    content: "{{ ceph_admin_keyring_content.content | b64decode }}"
    dest: /etc/ceph/ceph.client.admin.keyring
    mode: "0600"
    owner: ceph
    group: ceph
  when:
    - not ceph_keyring_local.stat.exists
    - ceph_admin_keyring_content is defined

- name: Create bootstrap-osd keyring directory
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd
    state: directory
    mode: "0755"
    owner: ceph
    group: ceph

- name: Get current bootstrap-osd keyring from primary monitor
  ansible.builtin.slurp:
    src: /var/lib/ceph/bootstrap-osd/ceph.keyring
  register: ceph_bootstrap_osd_keyring_content
  delegate_to: "{{ groups['ceph_monitors'][0] }}"
  become: true
  changed_when: false

- name: Write bootstrap-osd keyring to local OSD
  ansible.builtin.copy:
    content: "{{ ceph_bootstrap_osd_keyring_content.content | b64decode }}"
    dest: /var/lib/ceph/bootstrap-osd/ceph.keyring
    mode: "0644"
    owner: ceph
    group: ceph
  when: ceph_bootstrap_osd_keyring_content is defined

- name: Ensure bootstrap-osd keyring is also in /etc/ceph (ceph CLI looks here)
  ansible.builtin.file:
    src: /var/lib/ceph/bootstrap-osd/ceph.keyring
    dest: /etc/ceph/ceph.client.bootstrap-osd.keyring
    state: link
    force: true

- name: Check if OSD devices are explicitly configured
  ansible.builtin.set_fact:
    has_osd_devices: "{{ ceph_osd_devices is defined and ceph_osd_devices | length > 0 }}"

- name: Debug OSD device configuration
  ansible.builtin.debug:
    msg: |
      OSD Configuration:
      - ceph_osd_devices defined: {{ ceph_osd_devices is defined }}
      - ceph_osd_devices value: {{ ceph_osd_devices | default('NOT DEFINED') }}
      - ceph_osd_devices length: {{ ceph_osd_devices | length if ceph_osd_devices is defined else 'N/A' }}
      - has_osd_devices: {{ has_osd_devices }}

- name: List available block devices (info only)
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -d -n -l -o NAME,SIZE,TYPE | grep -v loop | grep -v zram | head -5 || echo "No devices listed"
  register: block_devices
  changed_when: false

- name: Display available devices for reference
  ansible.builtin.debug:
    msg: "Available block devices (for future OSD setup): {{ block_devices.stdout }}"

- name: Display OSD setup mode
  ansible.builtin.debug:
    msg: "Running in monitor-only mode. To enable OSDs, set ceph_osd_devices in group_vars/ceph_osds.yml"
  when: not has_osd_devices

- name: "Debug: list block devices and LVM info before OSD preparation"
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== lsblk ==="
    lsblk -o NAME,FSTYPE,SIZE,MOUNTPOINT -a || true
    echo "\n=== blkid ==="
    blkid || true
    echo "\n=== mounted ==="
    mount | grep -E '^/dev' || true
    echo "\n=== pvs/vgs/lvs ==="
    pvs -o pv_name,vg_name --noheadings 2>/dev/null || true
    vgs --noheadings 2>/dev/null || true
    lvs --noheadings 2>/dev/null || true
  register: osd_preflight
  changed_when: false
  when: has_osd_devices

- name: Display OSD preflight debug output
  ansible.builtin.debug:
    var: osd_preflight.stdout_lines
  when: has_osd_devices

- name: Read current cluster FSID
  ansible.builtin.shell: |
    set -o pipefail
    grep -m1 '^[[:space:]]*fsid[[:space:]]*=' /etc/ceph/ceph.conf | awk -F= '{print $2}' | tr -d ' '
  args:
    executable: /bin/bash
  register: ceph_conf_fsid
  changed_when: false


- name: Check ceph-volume metadata for each configured device
  ansible.builtin.script: check_osd_device.sh {{ item }} {{ ceph_conf_fsid.stdout }}
  loop: "{{ ceph_osd_devices }}"
  register: osd_device_check
  changed_when: false
  failed_when: false
  when:
    - has_osd_devices
    - ceph_osd_devices is defined
    - ceph_osd_devices | length > 0

- name: Set facts for devices with active running OSDs
  ansible.builtin.set_fact:
    devices_with_active_osds: "{{ devices_with_active_osds | default([]) + [item.item] }}"
  loop: "{{ osd_device_check.results }}"
  when:
    - has_osd_devices
    - item.stdout is defined
    - "'OSD_ACTIVE' in item.stdout"

- name: Set facts for devices with valid but inactive OSDs
  ansible.builtin.set_fact:
    devices_with_valid_osds: "{{ devices_with_valid_osds | default([]) + [item.item] }}"
  loop: "{{ osd_device_check.results }}"
  when:
    - has_osd_devices
    - item.stdout is defined
    - "'OSD_EXISTS' in item.stdout"

- name: Set facts for devices with stale OSDs (different cluster or failed)
  ansible.builtin.set_fact:
    devices_with_stale_osds: "{{ devices_with_stale_osds | default([]) + [item.item] }}"
  loop: "{{ osd_device_check.results }}"
  when:
    - has_osd_devices
    - item.stdout is defined
    - "'OSD_STALE' in item.stdout"

- name: Display device scan results
  ansible.builtin.debug:
    msg: |
      Devices with ACTIVE OSDs (skipped): {{ devices_with_active_osds | default([]) }}
      Devices with valid inactive OSDs (will be activated): {{ devices_with_valid_osds | default([]) }}
      Devices with stale OSDs (will be wiped): {{ devices_with_stale_osds | default([]) }}
  when: has_osd_devices

- name: Forcefully clean stale Ceph LVM and disk metadata
  ansible.builtin.shell: |
    set -o pipefail
    DEVICE="{{ item }}"
    DEVNAME=$(basename "$DEVICE")
    echo "Forcefully cleaning $DEVICE for Ceph OSD..."

    # Find OSD IDs tied to this device
    STALE_OSD_IDS=$(ceph-volume lvm list 2>/dev/null | awk -v dev="$DEVNAME" '
      /osd id/      { id=$3 }
      /devices/       { if ($0 ~ dev && id != "") print id }
    ' | sort -u)
    for osd_id in $STALE_OSD_IDS; do
      echo "Stopping and disabling stale ceph-osd@$osd_id for device $DEVNAME"
      systemctl stop "ceph-osd@$osd_id" 2>/dev/null || true
      systemctl disable "ceph-osd@$osd_id" 2>/dev/null || true
    done

    # Remove LVM structures
    for lv in $(lvs --noheadings -o lv_name,vg_name,devices 2>/dev/null | grep "$DEVNAME" | awk '{print $2"/"$1}' || true); do
      echo "Removing stale LV /dev/$lv"
      lvremove -f -y "/dev/$lv" 2>/dev/null || true
    done
    for vg in $(vgs --noheadings -o vg_name,pv_name 2>/dev/null | grep "$DEVNAME" | awk '{print $1}' || true); do
      echo "Removing stale VG $vg"
      vgremove -f -y "$vg" 2>/dev/null || true
    done

    pvremove -f -y "$DEVICE" 2>/dev/null || true
    wipefs -a "$DEVICE" 2>/dev/null || true
    dd if=/dev/zero of="$DEVICE" bs=1M count=100 2>/dev/null || true
    sync

    for osd_id in $STALE_OSD_IDS; do
      osd_dir="/var/lib/ceph/osd/ceph-$osd_id"
      if [ -d "$osd_dir" ]; then
        echo "Removing stale OSD dir $osd_dir"
        rm -rf "$osd_dir"
      fi
    done

    echo "Done cleaning $DEVICE"
  args:
    executable: /bin/bash
  loop: "{{ ceph_osd_devices }}"
  when:
    - has_osd_devices
    - ceph_osd_devices is defined
    - ceph_osd_devices | length > 0
    - item in (devices_with_stale_osds | default([]))
  become: true
  changed_when: true
  failed_when: false

- name: Prepare OSD devices (if available)
  ansible.builtin.shell: |
    ceph-volume lvm create --data {{ item }}
  args:
    executable: /bin/bash
  loop: "{{ ceph_osd_devices }}"
  when:
    - has_osd_devices
    - ceph_osd_devices is defined
    - ceph_osd_devices | length > 0
    - item not in (devices_with_active_osds | default([]))
    - item not in (devices_with_valid_osds | default([]))
  become: true
  changed_when: true
  failed_when: false

- name: Discover prepared OSD FSIDs
  ansible.builtin.shell: |
    ceph-volume lvm list 2>/dev/null | awk '/osd fsid/{print $3}'
  register: prepared_osd_fsids
  changed_when: false
  ignore_errors: true
  become: true

- name: Activate prepared OSDs by FSID
  ansible.builtin.shell: |
    ceph-volume lvm activate {{ item }}
  loop: "{{ prepared_osd_fsids.stdout_lines | default([]) }}"
  when:
    - has_osd_devices
    - prepared_osd_fsids.stdout_lines | length > 0
  become: true
  changed_when: true
  failed_when: false

- name: Discover OSD ids for started OSDs
  ansible.builtin.shell: |
    ceph-volume lvm list 2>/dev/null | awk '/osd id/{print $3}'
  register: discovered_osd_ids
  changed_when: false
  ignore_errors: true
  become: true
  when:
    - has_osd_devices

- name: Enable Ceph OSD services for discovered OSD ids
  ansible.builtin.systemd:
    name: "ceph-osd@{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ discovered_osd_ids.stdout_lines | default([]) }}"
  when:
    - has_osd_devices
    - discovered_osd_ids.stdout_lines | length > 0
  failed_when: false

- name: Wait for OSDs to join cluster
  ansible.builtin.shell: |
    set -o pipefail
    ceph osd tree 2>/dev/null | grep -q "up" || ceph -s | grep -q "osd: [1-9]"
  register: osds_status
  until: osds_status.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false
  when:
    - has_osd_devices
    - (devices_with_stale_osds | default([])) | length > 0 or (devices_with_valid_osds | default([])) | length > 0

- name: Confirm monitor-only setup
  ansible.builtin.debug:
    msg: "Monitor-only Ceph setup active. RBD pool will be available for Kubernetes persistence."
  when: not has_osd_devices

- name: Verify kubernetes pool exists (created by monitor role)
  ansible.builtin.shell: |
    set -o pipefail
    for i in {1..20}; do
      if timeout 10 ceph osd pool ls 2>/dev/null | grep -q kubernetes; then
        echo "pool exists"
        exit 0
      fi
      echo "Attempt $i/20: Creating pool..."
      timeout 10 ceph osd pool create kubernetes 32 32 --autoscale-mode on 2>/dev/null || true
      sleep 3
    done
    echo "pool-creation-timeout"
  register: pool_check
  changed_when: "'timeout' not in pool_check.stdout"
  failed_when: false
  when: inventory_hostname == groups['ceph_monitors'][0]

- name: Initialize RBD pool
  ansible.builtin.shell: |
    timeout 10 rbd pool init kubernetes 2>/dev/null || true
  changed_when: true
  failed_when: false
  when: inventory_hostname == groups['ceph_monitors'][0]

- name: Create Ceph RBD client for Kubernetes
  ansible.builtin.shell: |
    ceph auth get-or-create client.kubernetes \
      mon 'profile rbd' \
      osd 'profile rbd pool=kubernetes'
  register: ceph_client_key
  changed_when: ceph_client_key.rc == 0
  failed_when: false
  when: inventory_hostname == groups['ceph_monitors'][0]

- name: Display Ceph RBD client key
  ansible.builtin.debug:
    msg: "{{ ceph_client_key.stdout }}"
  when: ceph_client_key.stdout is defined
  failed_when: false

- name: Display OSD cluster status
  ansible.builtin.shell: |
    timeout 15 ceph -s || echo "Monitor not responding (timeout)"
  register: ceph_osd_status
  changed_when: false
  ignore_errors: true

- name: Show Ceph OSD status
  ansible.builtin.debug:
    msg: "{{ ceph_osd_status.stdout }}"
