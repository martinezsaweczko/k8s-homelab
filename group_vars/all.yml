# Global variables for all hosts
---
# These variables can be overridden by group_vars or host_vars

# Common settings
common_timezone: UTC
common_update_packages: true

# Kubernetes settings
k8s_version: "1.28"
helm_version: "3.13.3"
container_runtime: "containerd"
pod_network_cidr: "10.244.0.0/16"
k8s_microk8s_channel: "stable"

# Ceph settings
ceph_version: "quincy"
ceph_release: "quincy"
# Real LAN of the mini PCs (172.26.20.x); 192.168.56.0/24 was the old Vagrant net
ceph_public_network: "172.26.20.0/24"
ceph_cluster_network: "0.0.0.0/0"

# Storage pools
ceph_pool_name: "kubernetes"
ceph_pool_pg_num: 128
ceph_pool_pgp_num: 128
ceph_pool_size: 3
ceph_pool_min_size: 2

# MetalLB Configuration
metallb_enabled: true
metallb_version: "0.14.9"
metallb_namespace: "metallb-system"
metallb_ip_pool: "172.26.20.32/27"

# BGP Peering with MikroTik
metallb_bgp_my_asn: 64513          # MetalLB's AS
metallb_bgp_peer_ip: 172.26.20.1   # MikroTik peering IP (LAN interface)
metallb_bgp_peer_asn: 64512        # MikroTik's AS
